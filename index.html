<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Triedenie obrázkov podľa písmena – Vodotrisk</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Comic Sans MS', 'Segoe Print', 'Trebuchet MS', system-ui, sans-serif;
    background: linear-gradient(180deg, #d9f0fb 0%, #bfe3f7 55%, #a9d7f2 100%);
    color: #37474f;
    user-select: none; -webkit-user-select: none;
  }
  #app { height: 100dvh; display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; flex-wrap: wrap; position: relative; z-index: 5;
  }
  .pill {
    background: #ffffffcc; border-radius: 999px; padding: 6px 16px;
    font-size: clamp(.95rem, 1.8vw, 1.25rem); font-weight: bold;
    box-shadow: 0 2px 6px rgba(38,70,90,.18); white-space: nowrap;
  }
  #title { color: #0277bd; font-size: clamp(1.05rem, 2.4vw, 1.5rem); margin-right: auto; }
  header button {
    font-family: inherit; font-size: clamp(.95rem, 1.8vw, 1.2rem); font-weight: bold;
    border: none; border-radius: 999px; padding: 8px 18px; cursor: pointer;
    background: #e53935; color: #fff; box-shadow: 0 3px 0 #b71c1c;
  }
  header button:active { transform: translateY(2px); box-shadow: 0 1px 0 #b71c1c; }
  #soundBtn { background: #fff; color: #37474f; box-shadow: 0 3px 0 #b0bec5; font-size: 1.2rem; padding: 6px 12px; }

  /* Smajlík – malý banner hore, neprikryje obsah */
  #smiley {
    position: fixed; top: 6px; left: 50%; transform: translateX(-50%) translateY(-70px);
    display: flex; align-items: center; gap: 8px;
    background: #fffef7; border-radius: 999px; padding: 5px 18px 5px 8px;
    box-shadow: 0 4px 12px rgba(38,70,90,.25); z-index: 60; pointer-events: none;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1); font-weight: bold;
    font-size: clamp(1rem, 2vw, 1.25rem); white-space: nowrap;
  }
  #smiley.show { transform: translateX(-50%) translateY(0); }
  #smiley svg { width: 34px; height: 34px; flex: 0 0 auto; }
  #smiley.good { border: 3px solid #66bb6a; color: #2e7d32; }
  #smiley.bad  { border: 3px solid #ef5350; color: #c62828; }
  #smiley.info { border: 3px solid #42a5f5; color: #1565c0; }

  #main { flex: 1; display: flex; min-height: 0; }

  /* ------- Pumpa: vedľa hernej plochy na širokých obrazovkách ------- */
  #pumpSide {
    width: clamp(150px, 17vw, 230px); flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; padding: 6px 10px 12px;
  }
  #pumpSide svg { height: 100%; max-height: 560px; width: auto; max-width: 100%; }
  #pumpTop { display: none; width: 100%; justify-content: center; padding: 2px 10px 4px; }
  #pumpTop svg { width: min(96%, 480px); height: auto; }

  /* ------- Herná plocha ------- */
  #playArea {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: clamp(6px, 1.4vh, 14px);
    padding: 4px 12px 10px; position: relative;
  }
  #cardWrap { height: clamp(150px, 34vh, 320px); aspect-ratio: 1 / 1; max-width: 46vw; position: relative; }
  #card {
    width: 100%; height: 100%; background: #fff; border-radius: 22px;
    box-shadow: 0 8px 22px rgba(38,70,90,.22), inset 0 0 0 4px #e3f2fd;
    padding: 10px; cursor: grab; touch-action: none;
    display: flex; align-items: center; justify-content: center;
    transition: transform .22s ease, box-shadow .22s ease, filter .2s;
  }
  #card svg { width: 100%; height: 100%; pointer-events: none; }
  #card.grabbing { cursor: grabbing; z-index: 30; position: relative; }
  #card.held { transform: translateY(-8px) scale(1.03); box-shadow: 0 14px 26px rgba(38,70,90,.3), inset 0 0 0 5px #42a5f5; }
  #card.wrongAnim { filter: drop-shadow(0 0 0 #e53935); box-shadow: 0 0 0 5px #ef5350, 0 8px 22px rgba(198,40,40,.35); animation: shake .45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); } 40% { transform: translateX(9px); }
    60% { transform: translateX(-7px); } 80% { transform: translateX(5px); }
  }
  #nameLabel {
    min-height: 1.6em; font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: bold; color: #01579b;
    visibility: hidden; letter-spacing: .04em;
  }
  #nameLabel.show { visibility: visible; }
  #hint { font-size: clamp(.85rem, 1.6vw, 1.05rem); color: #456; opacity: .85; text-align: center; }

  /* ------- Košíky ------- */
  #baskets {
    display: grid; grid-template-columns: repeat(5, clamp(88px, 13.5vw, 150px));
    gap: clamp(8px, 1.6vw, 20px); margin-top: 2px;
  }
  .basket { cursor: pointer; transition: transform .18s; filter: drop-shadow(0 6px 10px rgba(38,70,90,.28)); touch-action: manipulation; }
  .basket svg { width: 100%; height: auto; display: block; }
  .basket.hover { transform: translateY(-8px) scale(1.06); }
  .basket.correct { animation: popGood .55s; }
  .basket.correct svg .bBody { fill: #66bb6a !important; }
  .basket.correct svg .bLetter { fill: #fff !important; }
  @keyframes popGood {
    0% { transform: scale(1); } 35% { transform: scale(1.14) rotate(-2deg); }
    70% { transform: scale(1.05) rotate(1deg); } 100% { transform: scale(1); }
  }
  .basket.wrong { animation: shake .5s; }
  .basket.wrong svg .bBody { fill: #ef5350 !important; }

  /* ------- Efekty ------- */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
  .star { position: absolute; top: -50px; will-change: transform; animation: starFall linear forwards; }
  @keyframes starFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(115vh) rotate(540deg); opacity: .95; }
  }
  .drop { position: absolute; will-change: transform; animation: dropFall cubic-bezier(.45,0,.9,.6) forwards; }
  @keyframes dropFall {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.7); opacity: .85; }
  }
  .pumping #handleV, .pumping #handleH { animation: pumpPress 1.7s ease-in-out; transform-box: fill-box; transform-origin: center; }
  @keyframes pumpPress {
    0% { transform: rotate(0); } 18% { transform: rotate(14deg); } 34% { transform: rotate(0); }
    52% { transform: rotate(14deg); } 68% { transform: rotate(0); } 84% { transform: rotate(10deg); } 100% { transform: rotate(0); }
  }
  #jetV, #jetH { opacity: 0; }
  body.watering #jetV, body.watering #jetH { opacity: 1; stroke-dasharray: 300; stroke-dashoffset: 300; animation: jetFlow 1.9s linear forwards; }
  @keyframes jetFlow { 0% { stroke-dashoffset: 300; } 100% { stroke-dashoffset: 0; } }
  #puddleV, #puddleH { transform-box: fill-box; transform-origin: bottom center; transform: scale(0,0); }
  body.watering #puddleV, body.watering #puddleH { animation: pudGrow 1.9s ease-out forwards .2s; }
  @keyframes pudGrow { 0% { transform: scale(.1,.3); } 100% { transform: scale(1,1); } }

  /* ------- Prekryvné obrazovky ------- */
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    z-index: 70; background: rgba(23,50,68,.45);
  }
  .overlay.show { display: flex; }
  .panel {
    background: #fffdf5; border-radius: 28px; padding: 30px 44px; text-align: center;
    box-shadow: 0 16px 44px rgba(10,40,60,.4); border: 5px solid #ffd54f;
    animation: panelIn .4s cubic-bezier(.34,1.56,.64,1); max-width: min(88vw, 560px);
  }
  @keyframes panelIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h2 { font-size: clamp(1.6rem, 4.5vw, 2.4rem); color: #0277bd; margin-bottom: 8px; }
  .panel p  { font-size: clamp(1.2rem, 3.2vw, 1.7rem); color: #37474f; margin-bottom: 18px; }
  .panel .bigBtn {
    font-family: inherit; font-size: clamp(1.4rem, 3.4vw, 1.9rem); font-weight: bold;
    border: none; border-radius: 999px; padding: 14px 44px; cursor: pointer;
    background: #43a047; color: #fff; box-shadow: 0 5px 0 #2e7d32;
  }
  .panel .bigBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2e7d32; }
  #finalSmiley { width: clamp(110px, 22vw, 170px); height: auto; margin-bottom: 6px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }

  /* ------- Tablet / úzka obrazovka: pumpa nad hernou plochou ------- */
  @media (max-width: 920px) {
    #main { flex-direction: column; }
    #pumpSide { display: none; }
    #pumpTop { display: flex; }
    #cardWrap { height: clamp(140px, 30vh, 260px); max-width: 60vw; }
    header { padding: 6px 10px; gap: 6px; }
    .pill { padding: 4px 12px; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    #cardWrap { height: clamp(120px, 38vh, 220px); }
  }

  /* Galéria na kontrolu ilustrácií (?gallery=1) */
  #gallery { display: none; height: 100dvh; overflow-y: auto; padding: 14px; }
  #gallery .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  #gallery figure { background: #fff; border-radius: 12px; padding: 6px; text-align: center; box-shadow: 0 2px 6px rgba(38,70,90,.15); }
  #gallery svg { width: 100%; height: auto; }
  #gallery figcaption { font-size: .85rem; font-weight: bold; color: #01579b; padding-top: 2px; }
</style>
</head>
<body>

        <rect x="35" y="352" width="110" height="18" rx="8" fill="#78909c"/>

        <g clip-path="url(#clipWV)">
          <rect id="waterV" x="58" y="356" width="64" height="0" fill="url(#gradWV)"/>

          <line x1="62" y1="58" x2="124" y2="34" stroke="#546e7a" stroke-width="9" stroke-linecap="round"/>

</div>

<div id="smiley"><span id="smileyFace"></span><span id="smileyText"></span></div>
<div id="fx"></div>

<div class="overlay" id="roundOverlay">
  <div class="panel">
    <h2 id="roundTitle">Výborne!</h2>
    <p id="roundQuestion">Pokračuješ ďalej?</p>

</div>

    <svg id="finalSmiley" viewBox="0 0 100 100">
      <circle cx="50" cy="52" r="40" fill="#fdd835" stroke="#f9a825" stroke-width="3"/>

<div id="gallery"><div class="grid" id="galleryGrid"></div></div>

<script>
'use strict';
/* ============ Zoznamy slov ============ */
const WORDS = {
  O: ['osa','orol','ovocie','okno','opasok','ohryzok','ostrov','ovca','orech','oliva','obálka','okuliare','oheň','obväz','obuv','oko','oblak','oslava','obed','opica','ohnisko','oblek','obruč','ostriež','obojok','obraz','obrus','odpad','oštep','olej'],

  B: ['babôčka','bizón','bojovnica','bocian','bubon','balón','budík','bicykel','bábika','bobor','bankomat','bankovka','bacil','balík','bábovka','byt','blesk','bublina','banán','brokolica','bageta','batoh','baterka','bunda','bager','bublifuk','bránka','balkón','bazén'],
  U: ['ucho','uterák','úsmev','uzol','úľ','uhorka','umývadlo','ulica','úroda','úloha','účes','ústa','učiteľ','uniforma','udica','umenie','umelec','upratovačka','utierka','uhlie','ukulele','umývačka','ulita','UFO'],
  A: ['auto','autobus','aktovka','ananás','antilopa','aligátor','anakonda','ara','agent','akvárium','anténa','avokádo','atrament','anjel','abeceda','akrobat','akordeón','album','atlas','ambulancia','astronaut','asteroid','autodráha','autosedačka']
};
const ALL_WORDS = [].concat(WORDS.O, WORDS.S, WORDS.B, WORDS.U, WORDS.A);
const BASKET_LETTERS = ['O','S','B','U','A'];
const BASKET_COLORS = {
  O: { body: '#fb8c00', dark: '#e65100', letter: '#ffffff' },
  S: { body: '#9e9e9e', dark: '#6f6f6f', letter: '#ffffff' },
  B: { body: '#ffffff', dark: '#37474f', letter: '#37474f' },
  U: { body: '#36454F', dark: '#242e35', letter: '#ffffff' },
  A: { body: '#007FFF', dark: '#005cbf', letter: '#ffffff' }
};
const IMG_PER_ROUND = 16, TOTAL_ROUNDS = 8;
const TEST_MODE = new URLSearchParams(location.search).has('test');
const SPEED = TEST_MODE ? 8 : 1; // zrýchlenie časovačov v testovacom režime

function $(id){ return document.getElementById(id); }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function firstLetter(word){
  const c = word[0].toUpperCase();
  return c === 'Ú' ? 'U' : c;
}
function wait(ms, fn){ return setTimeout(fn, ms / SPEED); }

/* ============ Zvuk (WebAudio, žiadne súbory) ============ */
let actx = null, soundOn = true;
function tone(freq, dur, delay, type, vol){
  if (!soundOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
const sndCorrect = () => { tone(660,.14,0); tone(880,.2,.1); };
const sndWrong   = () => { tone(233,.16,0,'square',.1); tone(174,.22,.12,'square',.1); };
const sndRound   = () => { tone(523,.14,0); tone(659,.14,.12); tone(784,.22,.24); };
const sndSplash  = () => { tone(980,.07,0,'sine',.12); tone(740,.08,.09,'sine',.12); tone(520,.12,.19,'sine',.12); };

/* ============ SVG ilustrácie (100×100) ============ */
const ART = {
/* ---------- O ---------- */

<ellipse cx="31" cy="44" rx="15" ry="7" fill="#bde3ff" transform="rotate(-32 31 44)"/>
<ellipse cx="69" cy="44" rx="15" ry="7" fill="#bde3ff" transform="rotate(32 69 44)"/>
<line x1="46" y1="16" x2="42" y2="6"/><line x1="54" y1="16" x2="58" y2="6"/>
<path d="M46 87 L50 97 L54 87 Z" fill="#37474f"/>
<path d="M50 30 C63 30 67 45 67 58 C67 74 59 84 50 87 C41 84 33 74 33 58 C33 45 37 30 50 30 Z" fill="#ffd23f"/>
<path d="M34.5 47 Q50 53 65.5 47 L65.5 54 Q50 60 34.5 54 Z" fill="#37474f" stroke="none"/>
<path d="M37 64 Q50 69 63 64 L62 71 Q50 75 38 71 Z" fill="#37474f" stroke="none"/>
<circle cx="50" cy="24" r="10" fill="#37474f"/>
<circle cx="46.5" cy="22" r="2" fill="#fff" stroke="none"/><circle cx="53.5" cy="22" r="2" fill="#fff" stroke="none"/>
</g></svg>`,
orol: `<svg viewBox="0 0 100 100"><g stroke="#37474f" stroke-width="2" stroke-linejoin="round">
<path d="M50 52 C40 38 22 30 6 34 C14 48 28 56 42 60 Z" fill="#8d5a2b"/>
<path d="M50 52 C60 38 78 30 94 34 C86 48 72 56 58 60 Z" fill="#8d5a2b"/>
<path d="M44 72 L56 72 L61 90 L39 90 Z" fill="#fafafa"/>
<ellipse cx="50" cy="60" rx="11" ry="15" fill="#8d5a2b"/>
<circle cx="50" cy="41" r="10" fill="#fafafa"/>
<path d="M50 44 L62 45 L51 52 Z" fill="#f9a825"/>
<circle cx="47" cy="39" r="2" fill="#263238" stroke="none"/>
</g></svg>`,
ovocie: `<svg viewBox="0 0 100 100"><g stroke="#37474f" stroke-width="2" stroke-linejoin="round">
<circle cx="52" cy="42" r="14" fill="#fb8c00"/>
<ellipse cx="27" cy="30" rx="8" ry="4" fill="#66bb6a" transform="rotate(-25 27 30)"/>

/* ============ Pumpa ============ */
function buildPumpLevels(){
  const lv = $('levelsV');
  let html = '';
  for (let k = 1; k <= 7; k++) {
    const y = 356 - 282 * k / 8;
    html += `<line x1="58" y1="${y}" x2="122" y2="${y}" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  }
  for (let k = 1; k <= 8; k++) {
    const y = 356 - 282 * (k - 0.5) / 8 + 4;
    html += `<text x="131" y="${y}" font-size="11" font-weight="bold" fill="#546e7a" font-family="'Comic Sans MS','Trebuchet MS',sans-serif">${k}</text>`;
  }
  lv.innerHTML = html;
  const lh = $('levelsH');
  let hh = '';
  for (let k = 1; k <= 7; k++) {
    const x = 60 + 280 * k / 8;
    hh += `<line x1="${x}" y1="30" x2="${x}" y2="86" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  }
  lh.innerHTML = hh;
}
let pumpAnim = null;
function setPump(level, animate){
  const vh = 282 / 8, hw = 280 / 8;
  const targetV = { y: 356 - vh * level, h: vh * level };
  const targetW = hw * level;
  const wv = $('waterV'), wh = $('waterH');
  if (pumpAnim) { cancelAnimationFrame(pumpAnim); pumpAnim = null; }
  if (!animate || TEST_MODE) {
    wv.setAttribute('y', targetV.y); wv.setAttribute('height', targetV.h);
    wh.setAttribute('width', targetW);
    return;
  }
  const startY = +wv.getAttribute('y'), startH = +wv.getAttribute('height'), startW = +wh.getAttribute('width');
  const t0 = performance.now(), dur = 900 / SPEED;
  const tick = (t) => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    wv.setAttribute('y', startY + (targetV.y - startY) * e);
    wv.setAttribute('height', startH + (targetV.h - startH) * e);
    wh.setAttribute('width', startW + (targetW - startW) * e);
    if (p < 1) pumpAnim = requestAnimationFrame(tick); else pumpAnim = null;
  };
  pumpAnim = requestAnimationFrame(tick);
}

const PRAISE = ['Správne!','Výborne!','Super!','Presne tak!','Bravo!','Trefa!'];

/* ============ Herný stav ============ */
const state = {
  bag: [], queue: [], round: 1, idx: 0, current: '',
  pumpLevel: 0, locked: true, held: false, wrongThisItem: false
};
function loadRound(){
  if (state.bag.length < IMG_PER_ROUND) state.bag = shuffle(ALL_WORDS);
  state.queue = state.bag.splice(0, IMG_PER_ROUND);
  state.idx = 0;
  showItem();
}
function showItem(){
  state.current = state.queue[state.idx];
  state.locked = false;
  state.wrongThisItem = false;
  const card = $('card');
  card.style.transition = ''; card.style.transform = ''; card.style.opacity = '';
  card.innerHTML = ART[state.current] || `<svg viewBox="0 0 100 100"><text x="50" y="62" font-size="40" text-anchor="middle" fill="#37474f">${state.current[0].toUpperCase()}</text></svg>`;
  card.classList.remove('held','wrongAnim');
  const nl = $('nameLabel');
  nl.textContent = state.current;
  nl.classList.remove('show');
  $('progress').textContent = `Obrázok ${state.idx + 1} zo ${IMG_PER_ROUND}`;
  $('roundInfo').textContent = `Kolo ${state.round} z ${TOTAL_ROUNDS}`;
}
function answer(letter, basketEl){
  if (state.locked) return;
  state.held = false;
  $('card').classList.remove('held');
  if (letter === firstLetter(state.current)) {
    state.locked = true;
    sndCorrect();
    basketEl.classList.add('correct');
    wait(700, () => basketEl.classList.remove('correct'));
    smiley('good', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    flyToBasket(basketEl, () => {
      state.idx++;
      if (state.idx >= IMG_PER_ROUND) endRound(); else showItem();
    });
    if (window.__TEST) window.__TEST.answers++;
  } else {
    sndWrong();
    state.wrongThisItem = true;
    basketEl.classList.add('wrong');
    wait(650, () => basketEl.classList.remove('wrong'));
    const card = $('card');
    card.classList.remove('wrongAnim'); void card.offsetWidth; card.classList.add('wrongAnim');
    wait(650, () => card.classList.remove('wrongAnim'));
    $('nameLabel').classList.add('show');
    smiley('bad', 'Skús to ešte raz');
    if (window.__TEST) window.__TEST.wrong++;
  }
}
function flyToBasket(basketEl, done){
  const card = $('card');
  const cr = card.getBoundingClientRect(), br = basketEl.getBoundingClientRect();
  const dx = (br.left + br.width / 2) - (cr.left + cr.width / 2);
  const dy = (br.top + br.height / 2) - (cr.top + cr.height / 2);
  card.style.transition = `transform ${450 / SPEED}ms ease-in, opacity ${450 / SPEED}ms ease-in`;
  card.style.transform = `translate(${dx}px, ${dy}px) scale(.25) rotate(10deg)`;
  card.style.opacity = '.15';
  wait(470, () => { card.style.transition = ''; card.style.transform = ''; card.style.opacity = ''; done(); });
}
function endRound(){
  state.locked = true;
  sndRound();
  state.pumpLevel++;
  setPump(state.pumpLevel, true);
  if (window.__TEST) window.__TEST.rounds = state.round;
  if (state.round >= TOTAL_ROUNDS) {
    spawnStars();
    wait(1100, () => {
      document.body.classList.add('pumping', 'watering');
      sndSplash();
      spawnDrops();
      wait(2200, () => {
        document.body.classList.remove('pumping');
        $('finalOverlay').classList.add('show');
      });
    });
  } else {
    spawnStars();
    wait(1000, () => {
      $('roundTitle').textContent = `Kolo ${state.round} hotové!`;
      $('roundQuestion').textContent = 'Pokračuješ ďalej?';
      $('roundOverlay').classList.add('show');
    });
  }
}
function newGame(){
  $('roundOverlay').classList.remove('show');
  $('finalOverlay').classList.remove('show');
  document.body.classList.remove('watering', 'pumping');
  state.round = 1; state.pumpLevel = 0; state.locked = false; state.held = false;
  state.bag = shuffle(ALL_WORDS);
  setPump(0, false);
  loadRound();
}

const DROP_SVG = '<svg viewBox="0 0 20 20"><path d="M10 1 C14 7 17 10 17 13.5 A7 7 0 0 1 3 13.5 C3 10 6 7 10 1 Z" fill="#4fc3f7"/></svg>';
function spawnDrops(){
  const svg = $('pumpSide').offsetParent ? $('pumpSvgV') : $('pumpSvgH');
  const r = svg.getBoundingClientRect();
  const tipX = r.left + r.width * (svg.id === 'pumpSvgV' ? 0.07 : 0.905);
  const tipY = r.top + r.height * (svg.id === 'pumpSvgV' ? 0.24 : 0.72);
  const fx = $('fx');
  const n = TEST_MODE ? 4 : 16;
  for (let i = 0; i < n; i++) {
    wait(i * 90, () => {
      const d = document.createElement('span');
      d.className = 'drop';
      const size = 10 + Math.random() * 12;
      d.style.left = tipX + 'px'; d.style.top = tipY + 'px';
      d.style.width = d.style.height = size + 'px';
      d.style.setProperty('--dx', (-40 + Math.random() * 80) + 'px');
      d.style.setProperty('--dy', (120 + Math.random() * 180) + 'px');
      d.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
      d.innerHTML = DROP_SVG;
      d.addEventListener('animationend', () => d.remove());
      fx.appendChild(d);
    });
  }
}

function basketAt(x, y){
  card.style.pointerEvents = 'none';
  const el = document.elementFromPoint(x, y);
  card.style.pointerEvents = '';
  return el ? el.closest('.basket') : null;
}
function clearHover(){
  document.querySelectorAll('.basket.hover').forEach(b => b.classList.remove('hover'));
}
card.addEventListener('pointerdown', (e) => {
  if (state.locked || drag) return;
  e.preventDefault();
  try { card.setPointerCapture(e.pointerId); } catch (err) {}
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, hover: null };
  card.classList.add('grabbing');
});
card.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx, dy) > 10) drag.moved = true;
  if (drag.moved) {
    card.style.transition = 'none';
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.max(-8, Math.min(8, dx * 0.05))}deg) scale(1.06)`;
    const b = basketAt(e.clientX, e.clientY);
    if (b !== drag.hover) {
      clearHover();
      if (b) b.classList.add('hover');
      drag.hover = b;
    }
  }
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  const wasMoved = drag.moved;
  card.classList.remove('grabbing');
  clearHover();
  if (wasMoved) {
    const b = basketAt(e.clientX, e.clientY);
    if (b) {
      card.style.transition = ''; card.style.transform = '';
      answer(b.dataset.letter, b);
    } else {
      card.style.transition = 'transform .25s ease';
      card.style.transform = '';
      wait(260, () => { card.style.transition = ''; });
    }
  } else {
    state.held = !state.held;
    card.classList.toggle('held', state.held);
    if (state.held) smiley('info', 'Teraz klepni na správny košík');
  }
  drag = null;
}
card.addEventListener('pointerup', endDrag);
card.addEventListener('pointercancel', (e) => {
  if (!drag) return;
  card.classList.remove('grabbing');
  clearHover();
  card.style.transition = 'transform .25s ease';
  card.style.transform = '';
  drag = null;
});
card.addEventListener('contextmenu', (e) => e.preventDefault());

/* ============ Tlačidlá ============ */
$('continueBtn').addEventListener('click', () => {
  $('roundOverlay').classList.remove('show');
  state.round++;
  loadRound();
});
$('finalNewGameBtn').addEventListener('click', newGame);
$('newGameBtn').addEventListener('click', newGame);
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
});

/* ============ Galéria ilustrácií (?gallery=1 alebo ?gallery=O) ============ */
const urlParams = new URLSearchParams(location.search);
if (urlParams.has('gallery')) {
  $('app').style.display = 'none';
  $('smiley').style.display = 'none';
  document.body.style.overflow = 'auto';
  const g = $('gallery');
  g.style.display = 'block';
  const f = urlParams.get('gallery');
  const words = (f && f.length === 1 && WORDS[f.toUpperCase()]) ? WORDS[f.toUpperCase()] : ALL_WORDS;
  $('galleryGrid').innerHTML = words.map(w =>
    `<figure>${ART[w] || '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#eee"/></svg>'}<figcaption>${w}</figcaption></figure>`
  ).join('');
} else {
  buildPumpLevels();
  newGame();
}

/* ============ Testovací režim (?test alebo ?test=wrong) ============ */
if (TEST_MODE) {
  window.__TEST = { answers: 0, wrong: 0, rounds: 0, errors: [] };
  window.addEventListener('error', (e) => { window.__TEST.errors.push(String(e.message)); console.log('TEST ERROR ' + e.message); });
  const wrongMode = urlParams.get('test') === 'wrong';
  const step = () => {
    try {
      if ($('finalOverlay').classList.contains('show')) {
        window.__TEST.done = true;
        window.__TEST.pump = state.pumpLevel;
        console.log('TEST RESULT ' + JSON.stringify(window.__TEST));
        document.title = window.__TEST.errors.length ? 'TEST-FAIL' : 'TEST-OK ' + window.__TEST.answers + '/' + window.__TEST.wrong;
        return;
      }
      if ($('roundOverlay').classList.contains('show')) { $('continueBtn').click(); setTimeout(step, 10); return; }
      if (!state.locked && state.current) {
        const correctL = firstLetter(state.current);
        if (wrongMode && !state.wrongThisItem) {
          const wrongL = BASKET_LETTERS.find(l => l !== correctL);
          answer(wrongL, basketEls[wrongL]);
        } else {
          answer(correctL, basketEls[correctL]);
        }
      }
    } catch (e) {
      window.__TEST.errors.push(String(e));
      console.log('TEST ERROR ' + e);
      document.title = 'TEST-FAIL';
      return;
    }
    setTimeout(step, 6);
  };
  setTimeout(step, 60);
}
</script>
